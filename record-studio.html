<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>录制工作室</title>
  <link rel="stylesheet" href="/test-dashboard.css" />
  <link rel="stylesheet" href="/src/dashboard/record-console/record-studio.css" />
</head>
<body class="rs-body">
  <header class="rs-top">
    <div class="rs-top-left">
      <a href="/api/test/record-console">← 交易列表</a>
      <strong id="rsTitle">录制工作室</strong>
      <span id="rsMeta" class="rs-muted">—</span>
    </div>
    <div class="rs-top-right">
      <span id="sessRemoteStatus" class="rs-pill">画面</span>
      <span id="rsAiBusy" class="rs-pill rs-warn" style="display:none">AI 录制中</span>
      <button type="button" id="rsDetachBtn" class="btn btn-sm btn-outline" title="关闭浏览器并释放执行机槽位">释放执行资源</button>
    </div>
  </header>

  <main class="rs-layout">
    <section class="rs-canvas-pane">
      <div class="rs-canvas-bar">
        <span id="sessRemoteInputHint" class="rs-muted">未附着</span>
        <button type="button" id="sessRemoteAttachBtn" class="btn btn-sm btn-outline" title="附着 CDP 并推流（不释放槽位）">附着/推流</button>
        <button type="button" id="sessRemoteDetachBtn" class="btn btn-sm btn-outline" title="断开画面推流，不释放执行机槽位">断开画面</button>
      </div>
      <div id="sessRemoteTabs" class="rs-tabs" title="点击切换标签：推流与 Agent 操作会同步到同一页"></div>
      <div id="sessRemoteStageWrap" class="rs-stage-wrap">
        <div id="sessRemoteStage">
          <canvas id="sessRemoteCanvas" tabindex="0"></canvas>
        </div>
      </div>
      <div id="sessRemoteInspectLabel" class="rs-muted rs-inspect">悬停高亮：—</div>
    </section>

    <aside class="rs-side">
      <div class="rs-resource" id="rsResource">准备中…</div>
      <div class="rs-actions">
        <button type="button" id="rsPrepareBtn" class="btn btn-sm btn-primary">一键准备 (prepare)</button>
        <button type="button" id="rsClearStepsBtn" class="btn btn-sm btn-outline">清空操作步骤</button>
      </div>
      <p class="rs-hint">一键 prepare：会话创建 → 分配浏览器 → 画面推流 → 导航登录（登录<strong>不计入步骤表</strong>）。账号请在交易列表页绑定。</p>

      <h3>⓪ 绑定账号（只读）</h3>
      <div id="rsLoginContext" class="rs-resource" style="margin-bottom:8px">加载账号…</div>
      <div id="rsAccountPreview" class="rs-muted" style="margin:4px 0 10px;font-size:11px">—</div>

      <h3>① 选择 AI 阶段（勾选）</h3>
      <div class="rs-actions">
        <button type="button" id="rsSelectAllBtn" class="btn btn-sm btn-outline">全选</button>
        <button type="button" id="rsSelectNoneBtn" class="btn btn-sm btn-outline">全不选</button>
      </div>
      <div id="rsPhases" class="rs-phases"></div>
      <div class="rs-actions">
        <button type="button" id="rsAiStartBtn" class="btn btn-sm btn-primary">AI 录制 start</button>
        <button type="button" id="rsStopBtn" class="btn btn-sm btn-outline">结束 stop</button>
      </div>

      <h3>人工录制</h3>
      <div class="rs-actions">
        <select id="rsManualPhase"></select>
        <button type="button" id="rsManualBtn" class="btn btn-sm btn-outline">开始人工录制</button>
      </div>
      <p class="rs-hint">AI 录制进行中时人工录制不可用（服务端 409）。</p>

      <h3>② 阶段 · 操作步骤</h3>
      <p class="rs-hint">勾选已落库步骤后点「回放选中」可在当前浏览器重跑（is_replay，不重复计入列表）。缺前面步骤时可先回放再 AI 录后续阶段。</p>
      <div class="rs-actions">
        <button type="button" id="rsRefreshTreeBtn" class="btn btn-sm btn-outline">刷新</button>
        <button type="button" id="rsReplayStepsBtn" class="btn btn-sm btn-primary">回放选中步骤</button>
        <a id="rsReviewLink" class="btn btn-sm btn-outline" href="#">确认列表</a>
      </div>
      <div id="rsStepTree" class="rs-step-tree"><div class="rs-muted">尚无步骤</div></div>

      <div id="rsLog" class="rs-log"></div>
    </aside>
  </main>

  <script type="module" src="/src/dashboard/record-console/record-studio.js"></script>
</body>
</html>
